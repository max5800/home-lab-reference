---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: example-app-config
  namespace: example-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-example
    kind: ClusterSecretStore
  target:
    name: example-app-config
    creationPolicy: Owner
  data:
    - secretKey: greeting
      remoteRef:
        key: placeholder/apps/example-app
        property: greeting
